services:
  voxshelf:
    build: .
    image: voxshelf:latest
    container_name: voxshelf
    ports:
      - "38492:38492"
    environment:
      - PORT=38492
      - API_KEY=${API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_TTS_MODEL=${GEMINI_TTS_MODEL:-gemini-3.1-flash-tts-preview}
      - GEMINI_TEXT_MODEL=${GEMINI_TEXT_MODEL:-gemini-2.5-flash}
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
    restart: unless-stopped

services:
  voxshelf:
    image: ghcr.io/techguyowen/voxshelf:latest
    container_name: voxshelf
    restart: unless-stopped
    ports:
      - "38492:38492"
    volumes:
      # Persistent storage for SQLite database (voxshelf.db) and audio cache
      - ./data:/app/data
    environment:
      - PORT=38492
      # Optional: You can enter your Gemini API key and select TTS/Text models
      # directly in the web UI (Settings gear icon).
      # If preferred, you can also pass them via environment variables below:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # - GEMINI_TTS_MODEL=gemini-3.1-flash-tts-preview # or gemini-3.8-flash-tts-preview
      # - GEMINI_TEXT_MODEL=gemini-3.8-flash
      # - API_KEY=optional_server_password # password lock for public servers

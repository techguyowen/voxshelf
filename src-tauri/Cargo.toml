[package]
name = "voxshelf"
version = "1.0.0"
description = "VoxShelf - self-hostable text-to-speech app powered by Gemini"
authors = ["VoxShelf"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
dirs = "5"
